project:
  type: website
  render:
    - index.qmd
    - slides.qmd
  resources:
    - assets/
    - presentation.html
    - presentation.pdf
    - results/figures/
    - results/*.csv
    - R/demo.R
    - scripts/*.R
    - docs/*.md

website:
  title: "JCOD · Sorted effects"
  navbar:
    left:
      - href: index.qmd
        text: Session
      - href: slides.qmd
        text: Slides
  page-footer: "Clinical Research · Journal Club / Open Discussion"

format:
  html:
    theme: [cosmo, theme.scss]
    toc: false

bibliography: references.bib
csl: the-quarterly-journal-of-economics.csl

execute:
  echo: false
  warning: false
  message: false
  cache: false
