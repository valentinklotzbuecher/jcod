name: build presentation preview

on:
  push:
    branches:
      - codex/plain-sorted-effects-20261021
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CLINICAL_BOOTSTRAPS: "499"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare build logs
        run: |
          mkdir -p build-logs
          git rev-parse HEAD > build-logs/source-commit.txt

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::boot
            any::Hmisc
            any::pbapply
            any::quantreg
            any::SparseM
            any::knitr
            any::rmarkdown
            any::sessioninfo
          dependencies: '"hard"'
          install-quarto: false

      - name: Install pinned SortedEffects source
        run: |
          set -euo pipefail
          package_source="$RUNNER_TEMP/SortedEffects-source"
          git init "$package_source"
          git -C "$package_source" remote add origin https://github.com/cran/SortedEffects.git
          git -C "$package_source" fetch --depth 1 origin 18a1196e474ee1b62d6722754e8e377cba4ddc1f
          git -C "$package_source" checkout --detach FETCH_HEAD
          test "$(git -C "$package_source" rev-parse HEAD)" = 18a1196e474ee1b62d6722754e8e377cba4ddc1f
          R CMD INSTALL "$package_source" 2>&1 | tee build-logs/sortedeffects-install.txt
          Rscript -e 'stopifnot(as.character(packageVersion("SortedEffects")) == "1.7.0")'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.27"
          tinytex: true

      - name: Install presentation font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core

      - name: Record runtime versions
        run: |
          set -euo pipefail
          quarto --version | tee build-logs/quarto-version.txt
          Rscript -e 'sessioninfo::session_info(pkgs = c("SortedEffects", "ggplot2", "Hmisc", "knitr", "rmarkdown"))' 2>&1 | tee build-logs/session-info.txt

      - name: Regenerate simulation
        run: |
          set -euo pipefail
          Rscript R/demo.R 2>&1 | tee build-logs/demo.txt

      - name: Regenerate and verify original-package inference
        run: |
          set -euo pipefail
          Rscript scripts/clinical-inference.R 2>&1 | tee build-logs/inference.txt

      - name: Validate simulation
        run: |
          set -euo pipefail
          Rscript scripts/validate-demo.R 2>&1 | tee build-logs/validate-demo.txt

      - name: Render portable HTML and PDF
        run: |
          set -euo pipefail
          bash scripts/render.sh 2>&1 | tee build-logs/render.txt
          test -s presentation.html
          test -s presentation.pdf

      - name: Upload rendered presentation and regenerated results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jcod-presentation-preview
          path: |
            presentation.html
            presentation.pdf
            results/
          if-no-files-found: error
          retention-days: 14

      - name: Install browser for slide inspection
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/jcod-browser-binaries
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/jcod-browser" --no-audit --no-fund --no-save playwright@1.62.1
          node "$RUNNER_TEMP/jcod-browser/node_modules/playwright/cli.js" install --with-deps --only-shell chromium

      - name: Inspect RevealJS slides in Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/jcod-browser/node_modules/playwright/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/jcod-browser-binaries
        run: |
          set -euo pipefail
          node scripts/check-slides.mjs 2>&1 | tee build-logs/browser-check.txt

      - name: Upload slide screenshots and layout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jcod-slide-preview
          path: build-logs/browser/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jcod-preview-build-logs
          path: |
            build-logs/
            !build-logs/browser/**
          if-no-files-found: warn
          retention-days: 14
